<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TeamRoom 智能协作空间</title>
    <link rel="stylesheet" href="/styles.css?v=20260512-dev2-template-layout-2" />
    <link rel="stylesheet" href="/airtable-theme.css?v=20260612-formal-1" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">TR</span>
          <div class="brand-copy">
            <h1>TeamRoom</h1>
            <span>智能协作空间</span>
          </div>
        </div>
        <div class="top-room">
          <strong id="topRoomName">尚未选择协作室</strong>
          <p id="connectionStatus" class="disconnected">尚未连接</p>
        </div>
        <div class="topbar-actions">
          <button id="openConfigButton" class="icon-button" type="button" title="连接与设置" aria-label="连接与设置">⚙</button>
        </div>
      </header>

      <main class="layout">
        <aside class="panel sidebar">
          <section class="section connection-section">
            <div class="section-header">
              <h2>当前连接</h2>
            </div>
            <div class="connection-card">
              <div class="connection-card-head">
                <div>
                  <strong id="connectionProfileName">本机运行服务</strong>
                  <small id="connectionBackendLabel">正在识别</small>
                </div>
                <span id="connectionProfileStatus" class="connection-pill">未连接</span>
              </div>
              <div id="connectionWorkspace" class="connection-path">尚未设置工作区</div>
              <div class="connection-actions">
                <button id="reconnectOpenClawButton" class="secondary-button" type="button" title="重新连接运行服务，不会重新发送任务">重连服务</button>
                <button id="connectionDetailsButton" class="secondary-button" type="button">连接详情</button>
              </div>
              <div id="connectionDetails" class="connection-details hidden">
                <div><span>运行服务</span><strong id="runtimeVersion">尚未检测</strong></div>
                <div><span>可用能力</span><strong id="runtimeCapabilities">尚未检测</strong></div>
                <div><span>文件区</span><strong id="runtimeFileArea">尚未设置</strong></div>
                <button id="copyNativeViewCommandButton" class="secondary-button" type="button">复制原生查看命令</button>
              </div>
            </div>
          </section>

          <section class="section rooms-section">
            <div class="section-header">
              <h2>协作室</h2>
              <button id="createRoomButton" class="icon-button" type="button" title="新建协作室">+</button>
            </div>
            <form id="roomForm" class="compact-create hidden">
              <input id="roomNameInput" name="name" placeholder="协作室名称" />
              <button type="submit">创建</button>
            </form>
            <div id="roomsList" class="list"></div>
          </section>

          <section class="section agents-section">
            <div class="section-header">
              <h2>协作成员</h2>
              <button id="refreshAgentsButton" class="icon-button" title="刷新成员">↻</button>
            </div>
            <div id="agentsList" class="list"></div>
          </section>
        </aside>

        <section class="panel conversation">
          <div class="conversation-header">
            <div class="conversation-title">
              <h2 id="activeRoomName">未选择协作室</h2>
              <p id="activeRoomPolicy">协作策略</p>
            </div>
            <div class="conversation-actions">
              <button id="checkCurrentRunButton" class="secondary-button compact-action" type="button" title="只检查当前任务的真实状态">检查当前任务</button>
              <span id="activeRunTimer" class="run-timer">暂无运行任务</span>
              <button id="showInspectorButton" class="icon-button" type="button" title="展开任务进展" aria-label="展开任务进展">‹</button>
            </div>
          </div>

          <div id="eventsFeed" class="events-feed"></div>

          <div class="composer-wrap">
            <form id="chatForm" class="chat-form">
              <textarea id="chatMessageInput" rows="2" placeholder="随时补充要求，内容会送回当前助手，不会从头开始"></textarea>
              <div class="composer-footer">
                <span id="composerHint">新消息将交给主要助手</span>
                <button id="chatSubmitButton" type="submit">发送</button>
              </div>
            </form>
          </div>
        </section>

        <aside id="inspector" class="panel inspector">
          <div class="inspector-head">
            <strong>任务进展</strong>
            <button id="collapseInspectorButton" class="icon-button" type="button" title="折叠右栏" aria-label="折叠右栏">›</button>
          </div>

          <section class="dispatch-panel">
            <div class="dispatch-heading">
              <strong>开始新任务</strong>
              <span>交给主要助手</span>
            </div>
            <form id="taskForm" class="stack">
              <textarea id="taskGoalInput" rows="3" placeholder="描述你接下来想完成的事情"></textarea>
              <label class="task-file-picker">
                <span>添加文件</span>
                <input id="taskFileInput" type="file" multiple />
              </label>
              <div id="taskFileList" class="task-file-list"></div>
              <div class="dispatch-footer">
                <small id="dispatchHint">当前没有运行中的任务</small>
                <button id="taskSubmitButton" type="submit">开始</button>
              </div>
            </form>
          </section>

          <nav class="inspector-tabs" aria-label="任务详情">
            <button class="active" type="button" data-inspector-tab="progress">当前进展</button>
            <button type="button" data-inspector-tab="files">文件</button>
            <button type="button" data-inspector-tab="time">用时</button>
            <button type="button" data-inspector-tab="history">历史任务</button>
          </nav>

          <div class="inspector-content">
            <section data-inspector-panel="progress">
              <div id="activeTaskStatus" class="active-task-status">暂无当前任务</div>
              <div class="inspector-block">
                <div class="inspector-block-title">协作过程</div>
                <div id="invocationTree" class="invocation-tree"></div>
              </div>
              <div class="inspector-block topology-section">
                <div class="inspector-block-title">协作成员关系</div>
                <div id="memberChips" class="topology-canvas"></div>
              </div>
              <button id="cancelTaskButton" type="button" class="stop-run-button">停止当前任务</button>
            </section>

            <section class="hidden" data-inspector-panel="files">
              <div id="filesPanel" class="empty-panel">当前任务暂未报告文件变化</div>
            </section>

            <section class="hidden" data-inspector-panel="time">
              <div id="timePanel" class="metric-panel"></div>
            </section>

            <section class="hidden" data-inspector-panel="history">
              <div id="tasksList" class="task-list"></div>
            </section>
          </div>
        </aside>
      </main>

      <input id="tokenInput" class="hidden" type="password" autocomplete="off" />
      <button id="saveTokenButton" class="hidden" type="button">保存 Token</button>

      <div id="setupModal" class="setup-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
        <section class="setup-modal">
          <div class="setup-brand">
            <span class="brand-mark">TR</span>
            <div><strong>TeamRoom</strong><small>首次启动设置</small></div>
          </div>
          <div class="setup-copy">
            <strong id="setupTitle">连接你的智能助手运行服务</strong>
            <p>选择本次 TeamRoom 使用的运行服务。</p>
          </div>
          <div class="backend-choices">
            <label>
              <input type="radio" name="setupBackend" value="opencode" checked />
              <span><strong>OpenCode</strong><small>支持流式过程、原生提问、权限、中断和恢复</small></span>
            </label>
            <label>
              <input type="radio" name="setupBackend" value="openclaw" />
              <span><strong>OpenClaw</strong><small>通过 Gateway 接入现有 OpenClaw 协作环境</small></span>
            </label>
          </div>
          <div class="setup-grid">
            <label>
              <span>如何连接</span>
              <select id="setupLaunchMode">
                <option value="managed">由 TeamRoom 启动本机服务</option>
                <option value="external">连接已经运行的服务</option>
              </select>
            </label>
            <label>
              <span>服务地址</span>
              <input id="setupBaseUrl" value="http://127.0.0.1:4096" />
            </label>
            <label id="setupWorkspaceField" class="setup-file-area">
              <span>OpenCode 项目文件夹</span>
              <div>
                <input id="setupWorkspacePath" readonly placeholder="请选择包含 Agent 配置的项目文件夹" />
                <button id="selectWorkspaceButton" class="secondary-button" type="button">选择文件夹</button>
              </div>
              <small id="setupWorkspaceHint">TeamRoom 将在这个文件夹中启动 OpenCode。</small>
            </label>
            <label class="setup-file-area">
              <span>文件区</span>
              <div>
                <input id="setupFileAreaPath" readonly />
                <button id="toggleFileAreaButton" class="secondary-button" type="button">切换默认文件区</button>
              </div>
              <small id="setupFileAreaHint">正在检测项目文件区</small>
            </label>
          </div>
          <div id="setupTestResult" class="setup-result hidden"></div>
          <div class="setup-actions">
            <button id="closeSetupButton" class="secondary-button" type="button">稍后设置</button>
            <button id="testSetupButton" class="secondary-button" type="button">测试连接</button>
            <button id="saveSetupButton" type="button">保存并进入</button>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="/app.js?v=20260613-v2-direct-runtime-1"></script>
  </body>
</html>
